<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mining Setting</title>
    <!-- reuse the main app styles so the look matches the main window -->
    <link rel="stylesheet" href="styles.css">
    <style>
  /* Fit container to window and avoid outer scroll; reserve space for scrollbar */
  *, *::before, *::after { box-sizing: border-box; }
  /* enforce square corners everywhere */
  * { border-radius: 0 !important; }
      html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
      body { background: var(--color-dark); }

      .container { 
        height: 100vh; 
        width: 100vw; 
        box-sizing: border-box; 
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .main-content { 
        flex: 1;
        width: 100%; 
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .list-section { 
        flex: 1;
        width: 100%; 
        display: flex; 
        flex-direction: column;
        overflow: hidden;
      }

      .section-title {
        background: #4a5f65;
        color: var(--color-light);
        padding: 4px 8px;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 4px;
        flex-shrink: 0;
      }

      /* Tab bar - horizontal scrollable */
      #tab-bar {
        display: flex;
        gap: 0;
        overflow-x: auto;
        overflow-y: hidden;
        background: #0f0f0f;
        border-bottom: 1px solid #333;
        scrollbar-width: thin;
        width: 100%;
        max-width: 100%;
        flex-shrink: 0;
        box-sizing: border-box;
      }

      #tab-bar::-webkit-scrollbar {
        height: 6px;
      }

      #tab-bar::-webkit-scrollbar-track {
        background: #0f0f0f;
      }

      #tab-bar::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 0;
      }

      .tab-item {
        flex-shrink: 0;
        padding: 6px 12px;
        background: #2a2a2a;
        color: #aaa;
        cursor: pointer;
        font-size: 12px;
        border: 1px solid #444;
        border-bottom: none;
        white-space: nowrap;
        user-select: none;
        transition: background 0.2s, color 0.2s;
      }

      .tab-item:hover {
        background: #3a3a3a;
        color: #ddd;
      }

      .tab-item.active {
        background: #4a5f65;
        color: #fff;
        border-color: #4a5f65;
      }

      /* Content area */
      #content-area {
        flex: 1;
        background: #0f0f0f;
        padding: 6px;
        overflow-y: auto;
        overflow-x: hidden;
        color: var(--color-light);
        font-size: 12px;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        min-height: 0;
      }

      /* Style for dummy checkboxes in content area */
      #content-area .round-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
        line-height: 1.2;
      }

      #content-area input[type="checkbox"] {
        width: 14px;
        height: 14px;
        cursor: pointer;
        margin: 0;
      }

      #content-area label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 0;
      }

      #content-area .banned label {
        text-decoration: line-through;
        color: #555;
      }

      #content-area .banned input[type="checkbox"] {
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="main-content">
        <div class="list-section">
          <div class="section-title">
            Select Round Types And Terrors
            <button id="import-btn" style="float:right;font-size:11px;padding:2px 8px;cursor:pointer;background:#5a7f85;color:#fff;border:none;">Import</button>
          </div>
          <div id="tab-bar">Loading...</div>
          <div id="content-area">Select a round type to view details</div>
        </div>
      </div>
    </div>
    <script>
      const ROUNDTYPE_PATH = 'assets/Roundtype.json';
      const TERRORS_PATH = 'assets/terrors.json';
      const TAB_ORDER = [
        'Classic',
        'Alternate',
        '8 Pages',
        'Fog',
        'Ghost',
        'Punished',
        'Sabotage',
        'Bloodbath',
        'Cracked',
        'Midnight',
        'Unbound',
        'Double Trouble',
        'EX',
        'Special'
      ];
      const SPECIAL_TAB_CONFIG = {
        key: 'special',
        label: 'Special',
        roundIds: [100, 101, 102, 103, 104, 106, 107],
        isSpecial: true
      };
      const IMPORT_SECTIONS = [
        'terrors',
        'alternates',
        'unbounds',
        'moons',
        'specials',
        'variants_8pages',
        'variants_misc',
        'variants_cracked',
        'variants_midnight'
      ];
      const IMPORT_IGNORE_MODES = new Set(['seen', 'variant', 'from_default', 'default', 'locked_variants']);
      const CATEGORY_TAB_SCOPE = {
        Classic: new Set(['classic', 'fog', 'punished', 'sabotage', 'cracked', 'bloodbath', 'double trouble', 'ex', 'ghost', 'midnight', '8 pages']),
        Alternate: new Set(['alternate', 'fog', 'ghost', 'midnight', '8 pages'])
      };
      // Which tracker sections/modes map to which round IDs.
      const sectionConfig = {
        terrors: {
          classic: [1],
          fog: [2],
          punished: [3],
          sabotage: [4],
          cracked: [5],
          bloodbath: [6, 7, 8],
          ghost: [9],
          unbounds: [10],
          midnight: [50],
          alternate: [51],
          alternates: [52, 53],
          '8pages': [105]
        },
        alternates: {
          alternate: [51],
          alternates: [52, 53],
          state: [52, 53],
          survived: [52, 53],
          midnight: [50],
          fog: [52],
          ghost: [53],
          '8pages': [105]
        },
        unbounds: {
          state: [10]
        },
        moons: {
          state: [100, 101, 102, 103, 104, 106, 107]
        },
        specials: {
          state: '__use_entry_rounds__'
        },
        variants_8pages: {
          '8pages': [105]
        },
        variants_misc: {
          state: [100, 101, 102, 103, 104, 106, 107]
        },
        variants_cracked: {
          state: [5]
        },
        variants_midnight: {
          state: [50]
        }
      };
      let terrorsData = [];
      let trackerKeyToTerror = {};
      let replacedByMap = {};
      let importData = null;
      let tabConfigs = [];
      let tabConfigByKey = new Map();
      function getTabBarElement() {
        return document.getElementById('tab-bar');
      }
      function getContentAreaElement() {
        return document.getElementById('content-area');
      }
      async function fetchJson(path) {
        const sep = path.includes('?') ? '&' : '?';
        const url = `${path}${sep}t=${Date.now()}`;
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) {
          throw new Error(`Failed to load ${path}: HTTP ${resp.status}`);
        }
        return resp.json();
      }
      function normalizeName(name) {
        return String(name || '').toLowerCase();
      }
      function findRoundTypeByName(roundTypes, desiredName) {
        const normalized = normalizeName(desiredName);
        const exact = roundTypes.find((item) => normalizeName(item.Name) === normalized);
        if (exact) return exact;
        return roundTypes.find((item) => {
          const current = normalizeName(item.Name);
          return current.includes(normalized) || normalized.includes(current);
        });
      }
      function createTabConfigFromRound(round, desiredName) {
        const roundIds = round.ID === 2
          ? [2, 52]
          : round.ID === 9
            ? [9, 53]
            : [round.ID];
        return {
          key: normalizeName(desiredName),
          label: round.Name,
          roundIds,
          isSpecial: false
        };
      }
      function buildTabConfigs(roundTypes) {
        const configs = [];
        const usedIds = new Set();
        for (const name of TAB_ORDER) {
          if (name === 'Special') {
            configs.push(SPECIAL_TAB_CONFIG);
            continue;
          }
          const round = findRoundTypeByName(roundTypes, name);
          if (!round) continue;
          if (usedIds.has(round.ID)) continue;
          usedIds.add(round.ID);
          configs.push(createTabConfigFromRound(round, name));
        }
        return configs;
      }
      function renderTabBar() {
        const tabBar = getTabBarElement();
        tabBar.innerHTML = '';
        tabConfigByKey = new Map(tabConfigs.map((cfg) => [cfg.key, cfg]));
        for (const config of tabConfigs) {
          const tab = document.createElement('div');
          tab.className = 'tab-item';
          tab.textContent = config.label;
          tab.dataset.key = config.key;
          tab.addEventListener('click', () => selectTabByKey(config.key));
          tabBar.appendChild(tab);
        }
      }
      function enableTabBarWheelScroll() {
        const tabBar = getTabBarElement();
        tabBar.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            e.preventDefault();
            tabBar.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      }
      async function loadRoundTypes() {
        try {
          const [roundTypes] = await Promise.all([
            fetchJson(ROUNDTYPE_PATH),
            loadTerrors()
          ]);
          tabConfigs = buildTabConfigs(roundTypes);
          renderTabBar();
          if (tabConfigs.length > 0) {
            selectTabByKey(tabConfigs[0].key);
          } else {
            getTabBarElement().textContent = 'No round types found';
          }
        } catch (e) {
          const tabBar = getTabBarElement();
          tabBar.textContent = 'Failed to load round types';
          console.error(e);
        }
      }
      async function loadTerrors() {
        try {
          terrorsData = await fetchJson(TERRORS_PATH);
          trackerKeyToTerror = {};
          replacedByMap = {};
          for (const terror of terrorsData) {
            if (terror.trackerKey) {
              trackerKeyToTerror[terror.trackerKey] = terror;
            }
            if (!Array.isArray(terror.replaces)) continue;
            for (const rep of terror.replaces) {
              if (!replacedByMap[rep.baseName]) replacedByMap[rep.baseName] = [];
              replacedByMap[rep.baseName].push({ replacer: terror, rounds: rep.rounds || [] });
            }
          }
        } catch (e) {
          console.error('Failed to load data:', e);
          terrorsData = [];
          trackerKeyToTerror = {};
          replacedByMap = {};
        }
      }
      function isStatusChecked(status) {
        if (typeof status === 'string') {
          return status === 'survived'
            || status === 'survived_ex'
            || status === 'survived_possessed'
            || status === 'achieved'
            || status === 'possessed';
        }
        if (typeof status === 'object' && status !== null) {
          return status.survived === true
            || status.survived_ex === true
            || status.survived_possessed === true
            || status.achieved === true
            || status.possessed === true;
        }
        return typeof status === 'boolean' ? status : false;
      }
      function getEntriesToProcess(entryData) {
        if (typeof entryData === 'string' || typeof entryData === 'boolean') {
          return [['state', entryData]];
        }
        if (typeof entryData === 'object' && entryData !== null) {
          return Object.entries(entryData);
        }
        return [];
      }
      function resolveRoundIds(modeMap, mode, terror) {
        let roundIds = modeMap[mode];
        if (roundIds === '__use_entry_rounds__') {
          roundIds = Array.isArray(terror.appearsInRounds) ? terror.appearsInRounds : [];
        }
        return Array.isArray(roundIds) ? roundIds : null;
      }
      function applyRoundCheck(state, terrorName, roundId, checked) {
        if (!state[terrorName]) state[terrorName] = {};
        const roundKey = String(roundId);
        const prev = state[terrorName][roundKey];
        // If multiple sections write the same target, keep true if any source is true.
        if (checked) {
          state[terrorName][roundKey] = true;
        } else if (prev === undefined) {
          state[terrorName][roundKey] = false;
        }
      }
      function applyReplacerChecks(state, terror, roundId, checked) {
        const replacers = replacedByMap[terror.Name];
        if (!replacers) return;
        for (const rep of replacers) {
          if (!Array.isArray(rep.rounds) || !rep.rounds.includes(roundId)) continue;
          applyRoundCheck(state, rep.replacer.Name, roundId, checked);
        }
      }
      function buildImportState(trackerData) {
        const state = {};
        for (const section of IMPORT_SECTIONS) {
          const sectionData = trackerData[section];
          if (!sectionData) continue;
          const modeMap = sectionConfig[section];
          if (!modeMap) continue;
          for (const [trackerKey, entryData] of Object.entries(sectionData)) {
            const terror = trackerKeyToTerror[trackerKey];
            if (!terror) continue;
            for (const [mode, status] of getEntriesToProcess(entryData)) {
              if (IMPORT_IGNORE_MODES.has(mode)) continue;
              const roundIds = resolveRoundIds(modeMap, mode, terror);
              if (!roundIds || roundIds.length === 0) continue;
              const checked = isStatusChecked(status);
              for (const roundId of roundIds) {
                applyRoundCheck(state, terror.Name, roundId, checked);
                applyReplacerChecks(state, terror, roundId, checked);
              }
            }
          }
        }
        return state;
      }
      async function gunzipBytes(bytes) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('DecompressionStream not available');
        }
        const ds = new DecompressionStream('gzip');
        const writer = ds.writable.getWriter();
        await writer.write(bytes);
        await writer.close();
        const reader = ds.readable.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const totalLength = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
        const merged = new Uint8Array(totalLength);
        let offset = 0;
        for (const chunk of chunks) {
          merged.set(chunk, offset);
          offset += chunk.length;
        }
        return new TextDecoder().decode(merged);
      }
      async function decodeImportFile(file) {
        const text = await file.text();
        const normalized = text.replace(/\s+/g, '');
        const raw = atob(normalized);
        const numbers = raw.split(',')
          .map((value) => Number.parseInt(value, 10))
          .filter((value) => Number.isFinite(value) && value >= 0 && value <= 255);
        if (numbers.length === 0) {
          throw new Error('Invalid import format');
        }
        const bytes = Uint8Array.from(numbers);
        const jsonStr = await gunzipBytes(bytes);
        return JSON.parse(jsonStr);
      }
      async function importFromFile(file) {
        try {
          const trackerData = await decodeImportFile(file);
          importData = buildImportState(trackerData);
          const currentTab = document.querySelector('.tab-item.active');
          if (currentTab && currentTab.dataset.key) {
            selectTabByKey(currentTab.dataset.key);
          }
          console.log('Import complete:', Object.keys(importData).length, 'terrors loaded');
        } catch (e) {
          console.error('Import failed:', e);
          alert('Import failed: ' + e.message);
        }
      }
      function terrorAppearsInAnyRound(terror, roundIds) {
        if (!Array.isArray(terror.appearsInRounds)) return false;
        return roundIds.some((roundId) => terror.appearsInRounds.includes(roundId));
      }
      function terrorReplacesInAnyRound(terror, roundIds) {
        if (!Array.isArray(terror.replaces)) return false;
        return terror.replaces.some((rep) => Array.isArray(rep.rounds) && rep.rounds.some((roundId) => roundIds.includes(roundId)));
      }
      function terrorIsInCategoryTabScope(terror, tabConfig) {
        const allowedTabs = CATEGORY_TAB_SCOPE[terror.category];
        if (!allowedTabs) return false;
        return allowedTabs.has(tabConfig.key);
      }
      function terrorActsAsReplacerInTab(terror, tabConfig) {
        if (tabConfig.isSpecial) return false;
        return terrorReplacesInAnyRound(terror, tabConfig.roundIds);
      }
      function hasValidTerrorShape(terror) {
        return terror
          && typeof terror.Name === 'string'
          && terror.Name.trim().length > 0
          && (Array.isArray(terror.appearsInRounds) || Array.isArray(terror.replaces));
      }
      function getTerrorsForTab(tabConfig) {
        const { roundIds } = tabConfig;
        const seenNames = new Set();
        return terrorsData.filter((terror) => {
          if (!hasValidTerrorShape(terror)) return false;
          if (terrorActsAsReplacerInTab(terror, tabConfig)) return false;
          const appears = terrorAppearsInAnyRound(terror, roundIds);
          const inCategoryScope = terrorIsInCategoryTabScope(terror, tabConfig);
          if (!appears && !inCategoryScope) return false;
          const normalized = normalizeName(terror.Name);
          if (seenNames.has(normalized)) return false;
          seenNames.add(normalized);
          return true;
        });
      }
      function terrorHasRound(terror, roundIds) {
        return Array.isArray(terror.appearsInRounds)
          && roundIds.some((roundId) => terror.appearsInRounds.includes(roundId));
      }
      function createTerrorLabel(terror, tabConfig) {
        let displayName = terror.Name;
        if (tabConfig.isSpecial) return displayName;
        const replacers = replacedByMap[terror.Name];
        if (!replacers) return displayName;
        const names = replacers
          .filter((rep) => Array.isArray(rep.rounds) && rep.rounds.some((roundId) => tabConfig.roundIds.includes(roundId)))
          .map((rep) => rep.replacer.Name);
        if (names.length > 0) {
          displayName += ` (${names.join(', ')})`;
        }
        return displayName;
      }
      function createTerrorRow(terror, tabConfig) {
        const hasRound = terrorHasRound(terror, tabConfig.roundIds);
        const row = document.createElement('div');
        row.className = 'round-item';
        if (!hasRound) row.classList.add('banned');
        const label = document.createElement('label');
        if (!hasRound) label.style.cursor = 'default';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.terrorName = terror.Name;
        checkbox.dataset.roundIds = tabConfig.roundIds.join(',');
        checkbox.disabled = !hasRound;
        if (hasRound && importData && importData[terror.Name]) {
          checkbox.checked = tabConfig.roundIds.some((roundId) => importData[terror.Name][String(roundId)] === true);
        }
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(` ${createTerrorLabel(terror, tabConfig)}`));
        row.appendChild(label);
        return row;
      }
      function renderTabContent(tabConfig) {
        const contentArea = getContentAreaElement();
        contentArea.innerHTML = '';
        const terrors = getTerrorsForTab(tabConfig);
        if (terrors.length === 0) {
          contentArea.innerHTML = '<p style="color: #888;">No terrors configured for this round.</p>';
          return;
        }
        for (const terror of terrors) {
          contentArea.appendChild(createTerrorRow(terror, tabConfig));
        }
      }
      function selectTabByKey(tabKey) {
        const tabConfig = tabConfigByKey.get(tabKey);
        if (!tabConfig) return;
        document.querySelectorAll('.tab-item').forEach((tab) => {
          tab.classList.toggle('active', tab.dataset.key === tabKey);
        });
        renderTabContent(tabConfig);
      }
      function setupImportButton() {
        const importBtn = document.getElementById('import-btn');
        if (!importBtn) return;
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.txt';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);
        importBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (event) => {
          const file = event.target.files[0];
          if (file) {
            await importFromFile(file);
          }
          fileInput.value = '';
        });
      }
      window.addEventListener('DOMContentLoaded', () => {
        enableTabBarWheelScroll();
        setupImportButton();
        loadRoundTypes();
      });
    </script>
  </body>
</html>

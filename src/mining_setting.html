<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mining Setting</title>
    <!-- reuse the main app styles so the look matches the main window -->
    <link rel="stylesheet" href="styles.css">
    <style>
  /* Fit container to window and avoid outer scroll; reserve space for scrollbar */
  *, *::before, *::after { box-sizing: border-box; }
  /* enforce square corners everywhere */
  * { border-radius: 0 !important; }
      html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
      body { background: var(--color-dark); }

      .container { 
        height: 100vh; 
        width: 100vw; 
        box-sizing: border-box; 
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .main-content { 
        flex: 1;
        width: 100%; 
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .list-section { 
        flex: 1;
        width: 100%; 
        display: flex; 
        flex-direction: column;
        overflow: hidden;
      }

      .section-title {
        background: #4a5f65;
        color: var(--color-light);
        padding: 4px 8px;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 4px;
        flex-shrink: 0;
      }

      /* Tab bar - horizontal scrollable */
      #tab-bar {
        display: flex;
        gap: 0;
        overflow-x: auto;
        overflow-y: hidden;
        background: #0f0f0f;
        border-bottom: 1px solid #333;
        scrollbar-width: thin;
        width: 100%;
        max-width: 100%;
        flex-shrink: 0;
        box-sizing: border-box;
      }

      #tab-bar::-webkit-scrollbar {
        height: 6px;
      }

      #tab-bar::-webkit-scrollbar-track {
        background: #0f0f0f;
      }

      #tab-bar::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 0;
      }

      .tab-item {
        flex-shrink: 0;
        padding: 6px 12px;
        background: #2a2a2a;
        color: #aaa;
        cursor: pointer;
        font-size: 12px;
        border: 1px solid #444;
        border-bottom: none;
        white-space: nowrap;
        user-select: none;
        transition: background 0.2s, color 0.2s;
      }

      .tab-item:hover {
        background: #3a3a3a;
        color: #ddd;
      }

      .tab-item.active {
        background: #4a5f65;
        color: #fff;
        border-color: #4a5f65;
      }

      /* Content area */
      #content-area {
        flex: 1;
        background: #0f0f0f;
        padding: 6px;
        overflow-y: auto;
        overflow-x: hidden;
        color: var(--color-light);
        font-size: 12px;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        min-height: 0;
      }

      /* Style for dummy checkboxes in content area */
      #content-area .round-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
        line-height: 1.2;
      }

      #content-area input[type="checkbox"] {
        width: 14px;
        height: 14px;
        cursor: pointer;
        margin: 0;
      }

      #content-area label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 0;
      }

      #content-area .banned label {
        text-decoration: line-through;
        color: #555;
      }

      #content-area .banned input[type="checkbox"] {
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="main-content">
        <div class="list-section">
          <div class="section-title">
            Select Round Types And Terrors
            <button id="import-btn" style="float:right;font-size:11px;padding:2px 8px;cursor:pointer;background:#5a7f85;color:#fff;border:none;">Import</button>
          </div>
          <div id="tab-bar">Loading...</div>
          <div id="content-area">Select a round type to view details</div>
        </div>
      </div>
    </div>

    <script>
      let roundTypes = [];
      let terrorsData = [];
      let roundTerrors = [];
      let variantsData = [];
      let terrorRoundsMap = {};
      let activeTab = null;
      let importData = null; // { terrorName: { roundId_str: bool } }

      async function loadRoundTypes() {
        try {
          const resp = await fetch('assets/Roundtype.json');
          const data = await resp.json();
          roundTypes = data;
          const tabBar = document.getElementById('tab-bar');
          tabBar.innerHTML = '';

          // Build tabs in a specific order requested by the user.
          // Note: names are matched case-insensitively against Roundtype.json entries.
          const desiredOrder = [
            'Classic',
            'Alternate',
            '8 Pages',
            'Fog',
            'Ghost',
            'Punished',
            'Sabotage',
            'Bloodbath',
            'Cracked',
            'Midnight',
            'Unbound',
            'Double Trouble',
            'EX',
            'Special'
          ];

          // Special group should include these round IDs (from Roundtype.json):
          const specialIds = [100, 101, 102, 103, 104, 106, 107];

          // Helper to find a round type entry by name (case-insensitive)
          function findRoundByName(name) {
            const lname = String(name).toLowerCase();
            return data.find(rt => String(rt.Name).toLowerCase() === lname);
          }

          desiredOrder.forEach((name) => {
            if (name === 'Special') {
              const tab = document.createElement('div');
              tab.className = 'tab-item';
              tab.textContent = 'Special';
              tab.dataset.special = 'true';
              tab.dataset.ids = specialIds.join(',');
              tab.dataset.categories = ['Icon_Variant','Icon_Variant_Skip','Moon_Special','Special_Round'].join(',');
              tab.addEventListener('click', () => selectTab(tab));
              tabBar.appendChild(tab);
              return;
            }

            const match = findRoundByName(name);
            if (match) {
              const tab = document.createElement('div');
              tab.className = 'tab-item';
              tab.textContent = match.Name;
              if (match.ID === 2) {
                tab.dataset.ids = '2,52';
              } else if (match.ID === 9) {
                tab.dataset.ids = '9,53';
              } else if (match.ID === 51) {
                // Alternate tab: show Alternate-category entries, check all Alternate sub-rounds
                tab.dataset.ids = '50,51,52,53,105';
              } else {
                tab.dataset.id = match.ID;
              }
              // Determine which terror categories to show for this tab
              const categoryMap = {
                'Classic': ['Classic'],
                'Alternate': ['Alternate'],
                '8 Pages': ['Classic','8Page_Special'],
                'Fog': ['Classic','Alternate'],
                'Ghost': ['Classic','Alternate'],
                'Punished': ['Classic'],
                'Sabotage': ['Classic'],
                'Bloodbath': ['Classic'],
                'Cracked': ['Classic'],
                'Midnight': ['Classic'],
                'Unbound': ['Unbound'],
                'Double Trouble': ['Classic'],
                'EX': ['Classic'],
              };
              const cats = categoryMap[name];
              if (cats) tab.dataset.categories = cats.join(',');
              tab.addEventListener('click', () => selectTab(tab));
              tabBar.appendChild(tab);
            } else {
              // If exact name not found, try a substring match (fallback)
              const lname = String(name).toLowerCase();
              const fuzzy = data.find(rt => String(rt.Name).toLowerCase().includes(lname) || lname.includes(String(rt.Name).toLowerCase()));
              if (fuzzy) {
                const tab = document.createElement('div');
                tab.className = 'tab-item';
                tab.textContent = fuzzy.Name;
                tab.dataset.id = fuzzy.ID;
                tab.addEventListener('click', () => selectTab(tab));
                tabBar.appendChild(tab);
              }
            }
          });

          // Add mouse wheel scroll support for tab bar
          tabBar.addEventListener('wheel', (e) => {
            // Only handle vertical wheel events for horizontal scrolling
            if (e.deltaY !== 0) {
              e.preventDefault();
              tabBar.scrollLeft += e.deltaY;
            }
            // Allow horizontal wheel/trackpad events to work naturally
          }, { passive: false });

          // Load terrors data
          await loadTerrors();

          // Select the first tab by default (if any)
          const firstTab = tabBar.querySelector('.tab-item');
          if (firstTab) selectTab(firstTab);
        } catch (e) {
          const tabBar = document.getElementById('tab-bar');
          tabBar.textContent = 'Failed to load round types';
          console.error(e);
        }
      }

      function buildRoundsMap() {
        terrorRoundsMap = {};
        for (const rt of roundTerrors) {
          if (!terrorRoundsMap[rt.terrorId]) terrorRoundsMap[rt.terrorId] = [];
          terrorRoundsMap[rt.terrorId].push(rt.roundId);
        }
      }

      function getTerrorRounds(terrorId) {
        return terrorRoundsMap[terrorId] || [];
      }

      async function loadTerrors() {
        try {
          const [terrResp, rtResp, varResp] = await Promise.all([
            fetch('assets/terrors.json'),
            fetch('assets/round_terrors.json'),
            fetch('assets/variants.json')
          ]);
          terrorsData = await terrResp.json();
          roundTerrors = await rtResp.json();
          variantsData = await varResp.json();
          buildRoundsMap();
        } catch (e) {
          console.error('Failed to load data:', e);
          terrorsData = [];
          roundTerrors = [];
          variantsData = [];
          terrorRoundsMap = {};
        }
      }

      // Section configuration: which tracker section maps to which modes and round IDs
      const sectionConfig = {
        'terrors': {
          'classic': [1],
          'fog': [2],
          'punished': [3],
          'sabotage': [4],
          'cracked': [5],
          'bloodbath': [6, 7, 8],
          'ghost': [9],
          'unbounds': [10],
          'midnight': [50],
          'alternate': [51],
          'alternates': [52, 53],   // tracker mode 'alternates' → Fog_Alt/Ghost_Alt
          '8pages': [105],
        },
        'alternates': {
          'alternate': [51],
          'alternates': [52, 53],   // top-level alternates section fallback
          'state': [52, 53],        // flat entry with 'state' mode
          'survived': [52, 53],     // flat entry with 'survived' key
          'midnight': [50],
          'fog': [52],
          'ghost': [53],
          '8pages': [105],
        },
        'unbounds': {
          'state': [10],
        },
        'moons': {
          'state': [100, 101, 102, 103, 104, 106, 107],
        },
        'specials': {
          'state': '__use_entry_rounds__',  // use the entry's own AppearsInRounds
        },
        'variants_8pages': {
          '8pages': [105],
        },
        'variants_misc': {
          'state': [100, 101, 102, 103, 104, 106, 107],
        },
        'variants_cracked': {
          'state': [5],
        },
        'variants_midnight': {
          'state': [50],
        },
      };

      function isStatusChecked(status) {
        if (typeof status === 'string') {
          return status === 'survived' || status === 'survived_ex' || status === 'survived_possessed' || status === 'achieved' || status === 'possessed';
        }
        if (typeof status === 'object' && status !== null) {
          return status.survived === true || status.survived_ex === true || status.survived_possessed === true || status.achieved === true || status.possessed === true;
        }
        if (typeof status === 'boolean') return status;
        return false;
      }

      async function importFromFile(file) {
        try {
          const text = await file.text();
          const rawStr = atob(text.trim());
          const nums = rawStr.split(',').map(s => parseInt(s, 10));
          const bytes = new Uint8Array(nums);

          let jsonStr;
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const reader = ds.readable.getReader();
            const chunks = [];
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
            }
            const totalLen = chunks.reduce((sum, c) => sum + c.length, 0);
            const merged = new Uint8Array(totalLen);
            let offset = 0;
            for (const c of chunks) {
              merged.set(c, offset);
              offset += c.length;
            }
            jsonStr = new TextDecoder().decode(merged);
          } else {
            throw new Error('DecompressionStream not available');
          }

          const trackerData = JSON.parse(jsonStr);

          // Load tracker map
          const mapResp = await fetch('assets/tracker_map.json');
          const trackerMap = await mapResp.json();

          // Build id -> name lookup
          const idToName = {};
          for (const t of terrorsData) {
            idToName[t.id] = t.Name;
          }

          // Build import data from ALL sections
          const newData = {};
          const sections = ['terrors', 'alternates', 'unbounds', 'moons', 'specials',
                            'variants_8pages', 'variants_misc', 'variants_cracked', 'variants_midnight'];

          for (const section of sections) {
            const secData = trackerData[section];
            if (!secData) continue;
            const modeMap = sectionConfig[section];
            if (!modeMap) continue;

                for (const [trackerKey, tdata] of Object.entries(secData)) {
                  const ids = trackerMap[trackerKey];
                  if (!Array.isArray(ids)) continue;
                  for (const id of ids) {
                    const name = idToName[id];
                    if (!name) continue;
                    if (!newData[name]) newData[name] = {};

                    // Handle both flat entries (string/boolean) and nested entries (object)
                    let entriesToProcess = [];
                    if (typeof tdata === 'string' || typeof tdata === 'boolean') {
                      entriesToProcess = [['state', tdata]];
                    } else if (typeof tdata === 'object' && tdata !== null) {
                      entriesToProcess = Object.entries(tdata);
                    } else {
                      continue;
                    }

                    for (const [mode, status] of entriesToProcess) {
                      if (mode === 'seen' || mode === 'variant' || mode === 'from_default' || mode === 'default' || mode === 'locked_variants') continue;
                      let roundIds = modeMap[mode];
                      if (roundIds === '__use_entry_rounds__') {
                        const t = terrorsData.find(e => e.Name === name);
                        roundIds = t ? getTerrorRounds(t.id) : null;
                        if (roundIds && roundIds.length === 0) roundIds = null;
                      }
                      if (!roundIds) continue;
                      const checked = isStatusChecked(status);
                      for (const rid of roundIds) {
                        newData[name][String(rid)] = checked;
                      }
                    }
                  }
                }
          }

          importData = newData;

          // Re-render current tab
          const currentTab = document.querySelector('.tab-item.active');
          if (currentTab) {
            selectTab(currentTab);
          }

          console.log('Import complete:', Object.keys(importData).length, 'terrors loaded from', sections.length, 'sections');
        } catch (e) {
          console.error('Import failed:', e);
          alert('Import failed: ' + e.message);
        }
      }

      function selectTab(tabOrId, maybeName) {
        // Allow calling with either (element) or (id, name)
        let tabElement = null;
        let roundIds = [];
        let allowedCategories = null;

        if (tabOrId && typeof tabOrId === 'object' && tabOrId.classList && tabOrId.classList.contains('tab-item')) {
          tabElement = tabOrId;
          if (tabElement.dataset.ids) {
            roundIds = String(tabElement.dataset.ids).split(',').map(s => parseInt(s, 10)).filter(Boolean);
          } else if (tabElement.dataset.id) {
            roundIds = [parseInt(tabElement.dataset.id, 10)];
          }
          if (tabElement.dataset.categories) {
            allowedCategories = tabElement.dataset.categories.split(',');
          }
        } else {
          // old signature: (id, name)
          const id = tabOrId;
          const el = Array.from(document.querySelectorAll('.tab-item')).find(t => t.dataset.id == id);
          if (el) tabElement = el;
          roundIds = [parseInt(id, 10)];
        }

        // Update active tab styling
        document.querySelectorAll('.tab-item').forEach(tab => {
          if (tab === tabElement) tab.classList.add('active'); else tab.classList.remove('active');
        });

        activeTab = tabElement ? (tabElement.dataset.ids || tabElement.dataset.id || 'special') : null;

        // Update content area with terrors for this round(s)
        const contentArea = document.getElementById('content-area');
        contentArea.innerHTML = '';

        // Get all terrors that belong to the allowed categories
        let terrorsToShow = [];
        if (allowedCategories) {
          terrorsToShow = terrorsData.filter(t => {
            const cat = t.category || 'Classic';
            return allowedCategories.includes(cat);
          });
        } else {
          // Fallback: filter by round_terrors
          terrorsToShow = terrorsData.filter(t => {
            const arr = getTerrorRounds(t.id);
            return roundIds.some(rid => arr.includes(rid));
          });
        }

        if (terrorsToShow.length === 0) {
          contentArea.innerHTML = `<p style="color: #888;">No terrors configured for this round.</p>`;
          return;
        }

        // Create checkboxes for each terror
        terrorsToShow.forEach(terror => {
          const arr = getTerrorRounds(terror.id);
          const hasRound = roundIds.some(rid => arr.includes(rid));

          const div = document.createElement('div');
          div.className = 'round-item';
          if (!hasRound) div.classList.add('banned');

          const label = document.createElement('label');
          // Banned terrors: label not clickable
          if (!hasRound) label.style.cursor = 'default';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.dataset.terrorName = terror.Name;
          checkbox.dataset.roundIds = roundIds.join(',');

          if (!hasRound) {
            checkbox.disabled = true;
          } else {
            // Apply import data if available
            if (importData && importData[terror.Name]) {
              const anyChecked = roundIds.some(rid => importData[terror.Name][String(rid)] === true);
              checkbox.checked = anyChecked;
            }
          }

          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(' ' + terror.Name));

          div.appendChild(label);
          contentArea.appendChild(div);
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        loadRoundTypes();

        const importBtn = document.getElementById('import-btn');
        if (importBtn) {
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.txt';
          fileInput.style.display = 'none';
          document.body.appendChild(fileInput);

          importBtn.addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
              await importFromFile(file);
            }
            fileInput.value = '';
          });
        }
      });
    </script>
  </body>
</html>
